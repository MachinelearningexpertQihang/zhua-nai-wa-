<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="3D 抓奶蛙：三个一样就消除，把盆底的宇宙奶蛙抓出来。">
<meta name="theme-color" content="#e3d9fb">
<title>抓奶蛙</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
/* Theme: pale sky-blue pond with sunny-yellow actions.
   Layout: phone-first one-screen game. Overlay screens (home / dex / leaderboard) sit above the game; the game is a status bar, a 3D pond basin, a wooden tray and four prop buttons. One deliberate pond look in both host themes. */
:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --pond:#e4dafc; --pond-hi:#faf7ff; --pond-lo:#c6b3f3; --pond-deep:#6a4fc9; --ink:#2e2552; --ink-soft:#6b628f; --mist:#e6f4fe;
  --milk:#fffaf0; --cream:#fff3d6; --wood:#9a5f2c; --wood-dark:#5e3716; --wood-light:#c98a4d;
  --sun:#ffd23f; --sun-dark:#c9971a; --berry:#ef5a7a; --berry-dark:#b8304f; --sky:#6fb8ff;
  --common:#5fae54; --rare:#4f8fe8; --legend:#8a5cf0;
  --display:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% 30%,var(--pond-hi) 0%,var(--pond) 50%,var(--pond-lo) 100%);color:var(--ink);font-family:var(--display);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- shared bits ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.78);border-radius:999px;padding:5px 11px;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:0 2px 0 rgba(106,79,201,.25)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border:0;border-radius:14px;background:rgba(255,255,255,.85);color:var(--pond-deep);box-shadow:0 3px 0 rgba(106,79,201,.35);flex:none}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(106,79,201,.35)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:20px;padding:13px 18px;font-size:20px;background:var(--sun);color:#5a3d00;box-shadow:0 5px 0 var(--sun-dark),0 9px 14px rgba(0,0,0,.15)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sun-dark)}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.btn.green{background:#fff;color:var(--pond-deep);box-shadow:0 5px 0 #cfc0f2,0 9px 14px rgba(0,0,0,.12)}
.btn.pink{background:var(--berry);color:#fff;box-shadow:0 5px 0 var(--berry-dark),0 9px 14px rgba(0,0,0,.15)}
.btn small{font-size:13px;opacity:.75;font-family:var(--body);font-variant-numeric:tabular-nums}
.toggle[aria-pressed="false"]{opacity:.5}
.toggle[aria-pressed="false"] .on{display:none}.toggle[aria-pressed="true"] .off{display:none}

/* ---------- pond decor ---------- */
.decor{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.pad{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 8%,rgba(255,255,255,.25) 22%,rgba(170,215,247,.18) 60%,rgba(255,255,255,.45) 100%);border:2px solid rgba(255,255,255,.7);animation:drift 14s ease-in-out infinite alternate}
.pad::after{content:"";position:absolute;left:22%;top:16%;width:22%;height:12%;border-radius:50%;background:rgba(255,255,255,.9);transform:rotate(-30deg)}
@keyframes drift{to{transform:translate(14px,-10px) rotate(18deg)}}
.bubble{position:absolute;bottom:-20px;width:10px;height:10px;border-radius:50%;border:2px solid rgba(255,255,255,.8);animation:rise 9s linear infinite}
@keyframes rise{to{transform:translateY(-110vh) translateX(20px)}}

/* ---------- overlay screens ---------- */
.screen{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 18px);background:radial-gradient(ellipse at 50% 25%,var(--pond-hi) 0%,var(--pond) 55%,var(--pond-lo) 100%)}
.screen[hidden]{display:none}
.screen>*{position:relative;z-index:1}
.screen-head{width:100%;max-width:520px;display:flex;align-items:center;gap:10px;padding-block:4px 12px}
.screen-head h2{margin:0;flex:1;font-size:28px;font-weight:400;color:#fff;text-shadow:0 2px 0 var(--pond-deep),0 4px 0 rgba(0,0,0,.12)}

/* home */
#home{gap:12px}
.home-bar{width:100%;max-width:440px;display:flex;align-items:center;gap:8px}
.home-bar .grow{flex:1}
.logo{display:flex;gap:2px;margin-top:2px}
.logo span{display:inline-block;font-size:clamp(60px,18vw,88px);line-height:1;color:#fff;-webkit-text-stroke:3px var(--pond-deep);paint-order:stroke fill;text-shadow:0 6px 0 var(--pond-deep),0 12px 18px rgba(106,79,201,.25);animation:hopIn .7s cubic-bezier(.3,1.7,.5,1) both}
.logo span:nth-child(1){transform:rotate(-8deg);animation-delay:.05s}
.logo span:nth-child(2){color:var(--sun);transform:translateY(-8px) rotate(4deg);animation-delay:.15s}
.logo span:nth-child(3){transform:rotate(-3deg);animation-delay:.25s}
@keyframes hopIn{from{opacity:0;translate:0 -50px;scale:.4}}
.tag{margin:0;font-family:var(--body);font-size:14px;color:var(--ink-soft);text-align:center}
.hero{position:relative;width:min(86vw,340px);height:min(52vw,220px);display:flex;align-items:flex-end;justify-content:center;margin-bottom:10px}
.hero .stand{position:absolute;bottom:0;left:24%;right:24%;height:30px;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#fff,#ece4fd 70%);box-shadow:0 6px 0 #c9b8f0,0 14px 20px rgba(106,79,201,.22)}
.hero .main{position:relative;z-index:1;height:94%;max-width:52%;object-fit:contain;margin-bottom:12px;animation:bob 1.6s ease-in-out infinite;transform-origin:50% 100%;cursor:pointer;filter:drop-shadow(0 6px 6px rgba(106,79,201,.25))}
.hero .main.ph{border-radius:22px;border:4px solid #fff;height:80%;box-shadow:0 6px 0 #c9b8f0}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-14px) scale(.97,1.04)}90%{transform:translateY(0) scale(1.05,.95)}}
.orb{position:absolute;width:58px;height:58px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 60%,#fff,#d6eefd);border:3px solid #fff;box-shadow:0 6px 14px rgba(106,79,201,.2);display:flex;align-items:center;justify-content:center;animation:float 3.6s ease-in-out infinite alternate}
.orb img{width:82%;height:82%;object-fit:contain}
.orb img.ph{width:100%;height:100%;object-fit:cover}
.orb::after{content:"";position:absolute;left:18%;top:10%;width:30%;height:16%;border-radius:50%;background:rgba(255,255,255,.85);transform:rotate(-30deg)}
@keyframes float{to{transform:translateY(-12px) rotate(4deg)}}
.nameplate{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);z-index:2;gap:6px}
.nameplate i{width:9px;height:9px;border-radius:50%;background:var(--rc,var(--common))}
.levels{width:100%;max-width:440px;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.lv{position:relative;text-align:left;border:0;border-radius:24px;padding:14px 14px 12px;background:#fff;box-shadow:0 6px 0 #cfc0f2,0 12px 18px rgba(106,79,201,.15);display:flex;flex-direction:column;gap:3px;overflow:hidden;min-height:140px;min-width:0}
.lv:active{transform:translateY(4px);box-shadow:0 2px 0 #cfc0f2}
.lv .tg{font-family:var(--body);font-size:12px;color:var(--ink-soft)}
.lv h3{margin:0;font-size:26px;font-weight:400;color:var(--pond-deep);line-height:1.15}
.lv .meta{font-family:var(--body);font-size:12px;color:var(--ink-soft)}
.lv .bt{margin-top:auto;font-size:15px;font-variant-numeric:tabular-nums;padding-right:40px}
.lv .go{position:absolute;right:12px;bottom:12px;width:36px;height:36px;border-radius:50%;background:var(--sun);box-shadow:0 3px 0 var(--sun-dark);display:flex;align-items:center;justify-content:center;color:#5a3d00}
.lv .go svg.i{width:16px;height:16px}
.lv .peek{position:absolute;right:-12px;top:-4px;width:72px;height:84px;object-fit:contain;transform:rotate(12deg);pointer-events:none}
.lv>*:not(.peek){position:relative;z-index:1}
.lv.hard{background:radial-gradient(1.5px 1.5px at 20% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 70% 60%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 40% 80%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 85% 20%,#fff 50%,transparent 51%),linear-gradient(160deg,#4a4fb0,#1d2155);box-shadow:0 6px 0 #14173d,0 12px 18px rgba(29,33,85,.3);color:#fff}
.lv.hard:active{box-shadow:0 2px 0 #14173d}
.lv.hard h3{color:#fff}.lv.hard .tg,.lv.hard .meta{color:#c9d3ff}.lv.hard .bt{color:#ffe08a}
.lv.locked .go{background:#8e96d6;box-shadow:none;color:#fff}
.lv.locked .peek{filter:brightness(0) opacity(.45)}
.lv.nudge{animation:nudge .4s}
@keyframes nudge{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.lv:disabled{cursor:default;opacity:.8}
.daily{width:100%;max-width:440px;display:flex;align-items:center;gap:12px;border:0;text-align:left;background:rgba(255,255,255,.8);border-radius:22px;padding:10px 14px 10px 10px;box-shadow:0 4px 0 rgba(106,79,201,.18)}
.daily .pic{width:62px;height:62px;border-radius:16px;flex:none;background:radial-gradient(circle at 50% 40%,#fff,color-mix(in srgb,var(--rc,var(--common)) 20%,#fff));display:flex;align-items:center;justify-content:center;overflow:hidden}
.daily .pic img{width:88%;height:88%;object-fit:contain}
.daily .pic img.ph{width:100%;height:100%;object-fit:cover}
.daily.locked .pic img{filter:brightness(0) opacity(.3)}
.daily>div:last-child{min-width:0;flex:1}
.daily small{display:block;font-family:var(--body);font-size:12px;color:var(--ink-soft)}
.daily b{font-weight:400;font-size:19px}
.daily p{margin:2px 0 0;font-family:var(--body);font-size:13px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu{width:100%;max-width:440px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu .btn{font-size:18px;padding:12px 10px}
/* dex */
.dex-sum{width:100%;max-width:520px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.7);border-radius:20px;padding:12px 14px;margin-bottom:14px}
.dex-sum b{font-size:30px;font-weight:400;font-variant-numeric:tabular-nums;color:var(--pond-deep)}
.dex-sum .meter{flex:1;height:12px;border-radius:99px;background:rgba(106,79,201,.15);overflow:hidden}
.dex-sum .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),#ffb03f);border-radius:99px}
.dex-sec{width:100%;max-width:520px}
.dex-sec h3{margin:6px 0 10px;font-size:20px;font-weight:400;color:#fff;text-shadow:0 2px 0 var(--pond-deep)}
.dex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px;margin-bottom:16px}
.dcard{position:relative;border:0;border-radius:18px;padding:8px 6px 9px;background:var(--milk);box-shadow:0 4px 0 var(--rc,var(--common));display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.dcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--rc,var(--common))}
.dcard .pic{width:100%;aspect-ratio:1;border-radius:13px;background:radial-gradient(circle at 50% 40%,#fff,color-mix(in srgb,var(--rc,var(--common)) 18%,#fff));display:flex;align-items:center;justify-content:center;overflow:hidden}
.dcard .pic img{width:88%;height:88%;object-fit:contain}
.dcard .pic img.ph,.card .pic img.ph{width:100%;height:100%;object-fit:cover;border-radius:13px}
.dcard.locked .pic img{filter:brightness(0) opacity(.28)}
.dcard .nm{font-size:15px;line-height:1.2;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dcard .no{position:absolute;top:6px;left:9px;font-size:12px;font-family:var(--body);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.dcard .new{position:absolute;top:-6px;right:-4px;background:var(--berry);color:#fff;font-size:12px;border-radius:9px;padding:1px 6px}
.r-common{--rc:var(--common)}.r-rare{--rc:var(--rare)}.r-legend{--rc:var(--legend)}
.rar{display:inline-block;font-size:13px;font-family:var(--body);color:#fff;background:var(--rc);border-radius:99px;padding:2px 9px}
.r-legend .rar{background:linear-gradient(90deg,#3b2a7a,var(--legend),#e3a73d)}

/* leaderboard */
.tabs{width:100%;max-width:520px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:rgba(255,255,255,.45);padding:5px;border-radius:18px;margin-bottom:12px}
.tabs button{border:0;border-radius:14px;padding:9px;font-size:17px;background:transparent;color:var(--pond-deep)}
.tabs button[aria-selected="true"]{background:#fff;box-shadow:0 3px 0 #cfc0f2}
.board{width:100%;max-width:520px;display:flex;flex-direction:column;gap:8px}
.rowr{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:10px;background:rgba(255,255,255,.82);border-radius:16px;padding:10px 14px}
.rowr.me{outline:3px solid var(--sun)}
.rank{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;background:rgba(106,79,201,.12);color:var(--pond-deep);font-variant-numeric:tabular-nums}
.rank.g1{background:#ffd23f;color:#6b4a00;box-shadow:0 2px 0 #c9971a}.rank.g2{background:#e3e8ee;color:#4b5563;box-shadow:0 2px 0 #aab3bd}.rank.g3{background:#f1b27f;color:#6b3410;box-shadow:0 2px 0 #c97d45}
.rowr .who{min-width:0}
.rowr .who b{display:block;font-weight:400;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowr .who small{font-family:var(--body);font-size:12px;color:var(--ink-soft)}
.rowr .t{font-size:20px;font-variant-numeric:tabular-nums;color:var(--pond-deep)}
.empty{font-family:var(--body);text-align:center;color:var(--ink-soft);background:rgba(255,255,255,.6);border-radius:16px;padding:22px 16px;line-height:1.6}
.stats{width:100%;max-width:520px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:rgba(255,255,255,.6);border-radius:14px;padding:8px;text-align:center}
.stats b{display:block;font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}
.stats small{font-family:var(--body);font-size:12px;color:var(--ink-soft)}
.note{font-family:var(--body);font-size:12px;color:var(--ink-soft);margin:12px 0 0;text-align:center;max-width:520px}

/* ---------- game ---------- */
#app{position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding-inline:12px;padding-block:8px 10px;gap:8px}
.hud{display:flex;align-items:center;gap:8px}
.prog{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.prog .bar{height:12px;border-radius:99px;background:rgba(255,255,255,.55);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sun),#ffb03f);border-radius:99px;transition:width .3s}
.prog span{font-family:var(--body);font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.timer.warn{background:var(--berry);color:#fff;animation:throb .5s ease-in-out infinite alternate}
@keyframes throb{to{transform:scale(1.08)}}
#stage{position:relative;flex:1;min-height:0;border-radius:26px;overflow:hidden}
#stage canvas{display:block;width:100%;height:100%;cursor:pointer}
#banner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding-inline:16px;text-align:center}
#banner span{font-size:34px;color:#fff;-webkit-text-stroke:2px var(--pond-deep);paint-order:stroke fill;text-shadow:0 4px 0 var(--pond-deep),0 8px 12px rgba(0,0,0,.2);opacity:0;transform:scale(.6) rotate(-4deg);transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1);text-wrap:balance}
#banner.on span{opacity:1;transform:scale(1) rotate(0)}
#toast{position:absolute;top:10px;left:50%;transform:translate(-50%,-70px);display:flex;align-items:center;gap:8px;background:var(--milk);border-radius:16px;padding:6px 14px 6px 6px;box-shadow:0 4px 0 var(--rc,var(--common)),0 8px 14px rgba(0,0,0,.15);transition:transform .4s cubic-bezier(.3,1.5,.5,1);white-space:nowrap;pointer-events:none;font-size:15px}
#toast.on{transform:translate(-50%,0)}
#toast img{width:36px;height:36px;object-fit:contain}
#toast small{display:block;font-family:var(--body);font-size:11px;color:var(--ink-soft)}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:18px;color:#fff;text-shadow:0 2px 0 var(--pond-deep);padding-inline:16px;text-align:center}
#loading[hidden]{display:none}
.dots{display:flex;gap:8px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--sun);box-shadow:0 3px 0 var(--sun-dark);animation:hop .6s ease-in-out infinite alternate}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes hop{to{transform:translateY(-12px)}}
#tray{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:9px 9px 11px;border-radius:20px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.04) 0 3px,transparent 3px 26px),linear-gradient(var(--wood-light),var(--wood));box-shadow:inset 0 3px 7px rgba(0,0,0,.45),0 5px 0 var(--wood-dark),0 10px 16px rgba(0,0,0,.25)}
#tray.danger{animation:wobble .35s ease-in-out infinite alternate}
@keyframes wobble{from{transform:rotate(-.8deg)}to{transform:rotate(.8deg)}}
.slot{aspect-ratio:1/1.08;max-width:100%;border-radius:12px;background:rgba(0,0,0,.24);box-shadow:inset 0 2px 4px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.slot img{width:94%;height:94%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.slot.land img{animation:land .3s cubic-bezier(.3,1.8,.5,1)}
@keyframes land{0%{transform:scale(1.35,.6)}60%{transform:scale(.9,1.15)}100%{transform:none}}
.slot.hide img{visibility:hidden}
.slot.pop img{animation:pop .28s ease-in forwards}
@keyframes pop{40%{transform:scale(1.4) rotate(-10deg)}100%{transform:scale(0) rotate(30deg);opacity:0}}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;border-radius:16px;padding:7px 4px 6px;font-size:15px;background:var(--sun);color:#5a3d00;box-shadow:0 4px 0 var(--sun-dark)}
.tool svg.i{width:22px;height:22px}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sun-dark)}
.tool:disabled{opacity:.45;cursor:default;transform:none}
.tool.free{background:#fff;color:var(--pond-deep);box-shadow:0 4px 0 #cfc0f2}
.tool b{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--berry);color:#fff;font-size:12px;font-weight:400;line-height:20px;padding:0 5px}

/* ---------- effects ---------- */
.fly{position:fixed;z-index:30;pointer-events:none;transition:transform .34s cubic-bezier(.3,.7,.3,1);filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
.bit{position:fixed;z-index:31;pointer-events:none;width:9px;height:9px;border-radius:2px;transition:transform .6s cubic-bezier(.2,.7,.4,1),opacity .6s ease-in}
.combo{position:fixed;z-index:32;pointer-events:none;font-size:30px;color:#fff;white-space:nowrap;-webkit-text-stroke:2px var(--berry-dark);paint-order:stroke fill;text-shadow:0 3px 0 var(--berry),0 5px 8px rgba(0,0,0,.3);transform:translate(-50%,0) scale(.5);opacity:0;transition:transform .5s cubic-bezier(.3,1.6,.5,1),opacity .3s}
.combo.on{transform:translate(-50%,-46px) scale(1);opacity:1}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(46,30,90,.55);z-index:60;padding-inline:16px}
.modal[hidden]{display:none}
.card{width:100%;max-width:330px;background:var(--milk);border-radius:28px;padding:22px 22px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:0 8px 0 rgba(0,0,0,.18);animation:card .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes card{from{transform:scale(.6)}}
.card h2{margin:0;font-size:30px;font-weight:400;text-wrap:balance}
.card p{margin:0;font-family:var(--body);font-size:15px;line-height:1.6;color:var(--ink-soft)}
.card .btn{width:100%}
.card .link{border:0;background:transparent;font-size:15px;padding:2px 10px;text-decoration:underline;color:var(--ink-soft)}
.card .big-t{font-size:44px;line-height:1;color:var(--pond-deep);font-variant-numeric:tabular-nums}
.card label{font-family:var(--body);font-size:13px;color:var(--ink-soft);align-self:flex-start}
.card input{width:100%;font:inherit;font-size:18px;border:2px solid #d9cfb8;border-radius:14px;padding:9px 12px;background:#fff;color:var(--ink);text-align:center}
.card .pic{width:180px;height:180px;border-radius:24px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#fff,color-mix(in srgb,var(--rc,var(--common)) 22%,#fff))}
.card .pic img{width:88%;height:88%;object-fit:contain;animation:bob 1.6s ease-in-out infinite;transform-origin:50% 100%}
.card.locked .pic img{filter:brightness(0) opacity(.3);animation:none}
.facts{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.facts div{background:rgba(106,79,201,.08);border-radius:12px;padding:7px}
.facts b{display:block;font-weight:400;font-size:20px;font-variant-numeric:tabular-nums}
.facts small{font-family:var(--body);font-size:12px;color:var(--ink-soft)}
.r-legend.card .pic{background:radial-gradient(circle at 50% 40%,#5b4bb0,#1b1640)}
/* splash */
#splash{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-inline:16px;padding-bottom:110px;overflow:hidden;cursor:pointer;transition:opacity .45s,transform .45s;
  background:radial-gradient(ellipse at 50% 30%,#ffffff 0%,#f0e9ff 38%,#d9cbfa 75%,#bfaaf3 100%)}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
#splash>*{position:relative;z-index:2}
.sp-rays{position:absolute!important;z-index:0!important;left:50%;top:34%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.55) 0 7deg,rgba(255,255,255,0) 7deg 20deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sp-bubbles{position:absolute!important;inset:0;z-index:1!important;pointer-events:none}
.sp-bubbles i{position:absolute;bottom:-30px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9) 0 12%,transparent 30%);animation:rise 10s linear infinite}
.sp-bubbles i:nth-child(1){left:8%;width:18px;height:18px}.sp-bubbles i:nth-child(2){left:22%;width:10px;height:10px;animation-delay:-3s;animation-duration:8s}
.sp-bubbles i:nth-child(3){left:41%;width:24px;height:24px;animation-delay:-6s}.sp-bubbles i:nth-child(4){left:63%;width:12px;height:12px;animation-delay:-1s;animation-duration:7s}
.sp-bubbles i:nth-child(5){left:78%;width:20px;height:20px;animation-delay:-4s}.sp-bubbles i:nth-child(6){left:90%;width:9px;height:9px;animation-delay:-8s;animation-duration:9s}
.sp-bubbles i:nth-child(7){left:52%;width:14px;height:14px;animation-delay:-2s;animation-duration:12s}
.sp-badge{font-family:var(--body);font-size:12px;letter-spacing:.06em;color:#6a4fc9;background:rgba(255,255,255,.85);border-radius:999px;padding:5px 12px;box-shadow:0 2px 0 rgba(106,79,201,.18);animation:fadeDown .6s .05s both}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}}
.sp-logo{display:flex;gap:4px;line-height:1}
.sp-logo span{display:inline-block;font-size:clamp(76px,24vw,118px);color:#fff;-webkit-text-stroke:5px #6a4fc9;paint-order:stroke fill;text-shadow:0 8px 0 #6a4fc9,0 16px 24px rgba(106,79,201,.3);animation:hopIn .8s cubic-bezier(.3,1.7,.5,1) both,wob 3.2s ease-in-out 1s infinite}
.sp-logo span:nth-child(1){--r:-8deg;transform:rotate(-8deg);animation-delay:.1s,1s}
.sp-logo span:nth-child(2){--r:4deg;color:var(--sun);transform:translateY(-10px) rotate(4deg);animation-delay:.22s,1.3s}
.sp-logo span:nth-child(3){--r:-3deg;transform:rotate(-3deg);animation-delay:.34s,1.6s}
@keyframes wob{0%,100%{rotate:0deg}50%{rotate:3deg}}
.sp-sub{margin:0;font-family:var(--body);font-size:14px;color:#5d4f8f;text-align:center;animation:fadeDown .6s .45s both}
.sp-hero{position:relative;width:min(50vw,200px);height:min(50vw,200px);display:flex;align-items:flex-end;justify-content:center;animation:fadeDown .7s .5s both}
.sp-hero img{width:100%;height:100%;object-fit:contain;animation:bob 1.6s ease-in-out infinite;transform-origin:50% 100%;filter:drop-shadow(0 6px 4px rgba(106,79,201,.25))}
.sp-shadow{position:absolute;bottom:-4px;left:24%;right:24%;height:14px;border-radius:50%;background:rgba(29,53,87,.16);animation:shadow 1.6s ease-in-out infinite;z-index:-1}
.sp-cta{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:4px;animation:fadeDown .6s .7s both}
#splash .tap{display:flex;align-items:center;gap:8px;background:var(--sun);color:#5a3d00;border-radius:999px;padding:13px 30px;font-size:22px;box-shadow:0 6px 0 var(--sun-dark),0 12px 20px rgba(201,151,26,.3);animation:throb .8s ease-in-out infinite alternate}
.sp-load{display:flex;flex-direction:column;align-items:center;gap:5px;width:200px;transition:opacity .4s}
.sp-load.done{opacity:0}
.sp-bar{width:100%;height:8px;border-radius:99px;background:rgba(255,255,255,.7);box-shadow:inset 0 1px 2px rgba(29,53,87,.15);overflow:hidden}
.sp-bar i{display:block;height:100%;width:6%;border-radius:99px;background:linear-gradient(90deg,#cbb8ff,#7a5cf0);transition:width .4s}
#splash small{font-family:var(--body);font-size:12px;color:#5d4f8f;font-variant-numeric:tabular-nums}
.sp-hint{display:flex;align-items:center;gap:5px}.sp-hint svg.i{width:14px;height:14px}
.sp-water{position:absolute!important;left:0;right:0;bottom:0;height:130px;z-index:1!important;pointer-events:none}
.sp-water svg{position:absolute;left:-40px;right:-40px;bottom:0;width:calc(100% + 80px);height:100%}
.sp-water .w1{fill:#ebe2ff;animation:wave 6s ease-in-out infinite alternate}.sp-water .w2{fill:#bba7f2}
.sp-peek{position:absolute;left:0;right:0;bottom:46px;display:flex;justify-content:space-around;padding-inline:4%;z-index:0}
.sp-peek img{width:min(17vw,78px);height:min(19vw,88px);object-fit:contain;object-position:50% 0;transform:translateY(40%);animation:peek 3.4s ease-in-out infinite}
.sp-peek img:nth-child(2){animation-delay:-.7s}.sp-peek img:nth-child(3){animation-delay:-1.5s}.sp-peek img:nth-child(4){animation-delay:-2.2s}.sp-peek img:nth-child(5){animation-delay:-2.9s}
@keyframes peek{0%,100%{transform:translateY(55%) rotate(-4deg)}45%{transform:translateY(8%) rotate(4deg)}60%{transform:translateY(12%) rotate(0)}}
.sp-water svg{z-index:1}
/* hidden level card + space theme */
.lv.secret{grid-column:1/-1;min-height:96px;background:radial-gradient(1.5px 1.5px at 12% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 40% 70%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 64% 22%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 88% 60%,#fff 50%,transparent 51%),linear-gradient(120deg,#1a1240,#3b1f7a 55%,#120b2e);box-shadow:0 6px 0 #0b0720,0 12px 18px rgba(20,10,60,.35);color:#fff}
.lv.secret h3{color:#fff}.lv.secret .tg,.lv.secret .meta{color:#cdbcff}.lv.secret .bt{color:#ffe08a}
.lv.secret .peek{width:84px;height:96px;top:-2px}
body.space{background:radial-gradient(1.5px 1.5px at 10% 20%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 30% 70%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 70% 15%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 85% 55%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 55% 90%,#fff 50%,transparent 51%),radial-gradient(ellipse at 50% 30%,#3b2f8f,#140f3a 60%,#07051a)}
body.space .decor{opacity:.35}
body.ice{background:radial-gradient(ellipse at 50% 25%,#ffffff 0%,#dff4ff 45%,#a9dcf5 100%)}
/* stars + poster */
.stars{display:flex;gap:6px;justify-content:center}
.stars svg{width:34px;height:34px;fill:#d9cfb8}
.stars svg.on{fill:var(--sun);filter:drop-shadow(0 2px 0 var(--sun-dark));animation:pop-in .4s cubic-bezier(.3,1.8,.5,1) both}
.stars svg:nth-child(2){animation-delay:.12s}.stars svg:nth-child(3){animation-delay:.24s}
@keyframes pop-in{from{transform:scale(0) rotate(-40deg)}}
.poster-wrap{width:100%;max-height:58vh;overflow:auto;border-radius:16px;background:#f3eeff}
.poster-wrap img{display:block;width:100%;height:auto;user-select:auto;-webkit-user-select:auto;-webkit-touch-callout:default}
.row2{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* tip the author */
.tipbox{width:100%;display:flex;align-items:center;gap:10px;background:#fff4d1;border:2px dashed #f0c24a;border-radius:18px;padding:10px 12px;text-align:left}
.tipbox p{flex:1;margin:0;font-size:13px;line-height:1.5;color:#7a5a12}
.tipbox .btn{width:auto;flex:none;font-size:16px;padding:9px 14px}
#tipModal{z-index:70}
.qr{width:min(64vw,240px);aspect-ratio:1;border-radius:18px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.12);background:#1b1b1b}
.qr img{width:100%;height:100%;object-fit:cover;user-select:auto;-webkit-user-select:auto;-webkit-touch-callout:default}
.support{border:0;background:transparent;font-family:var(--body);font-size:13px;color:var(--ink-soft);text-decoration:underline;padding:4px 8px}
/* ---------- tutorial ---------- */
#tut{position:fixed;inset:0;z-index:36;pointer-events:none;--x:50%;--y:50%;--r:52px}
#tut.tapall{pointer-events:auto;cursor:pointer}
.tut-dim{position:absolute;inset:0;background:radial-gradient(circle at var(--x) var(--y),transparent 0 var(--r),rgba(36,22,80,.58) calc(var(--r) + 18px));transition:background .2s}
.tut-ring{position:absolute;left:var(--x);top:var(--y);width:calc(var(--r)*2);height:calc(var(--r)*2);margin:calc(var(--r)*-1) 0 0 calc(var(--r)*-1);border:3px dashed rgba(255,255,255,.9);border-radius:50%;animation:spin 7s linear infinite}
.tut-hand{position:absolute;left:var(--x);top:var(--y);width:52px;height:52px;margin:8px 0 0 4px;color:#fff;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4));animation:tap 1.1s ease-in-out infinite}
.tut-hand svg.i{width:52px;height:52px;fill:#ffd23f;stroke:#5a3d00;stroke-width:1.6}
@keyframes tap{0%,100%{transform:translate(10px,14px) scale(1)}45%{transform:translate(0,0) scale(.88)}55%{transform:translate(0,0) scale(.88)}}
.tut-card{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);transform:translateX(-50%);width:min(88vw,340px);background:#fff;border-radius:22px;padding:12px 16px 10px;box-shadow:0 6px 0 rgba(106,79,201,.25),0 14px 24px rgba(0,0,0,.18);text-align:center;animation:card .35s cubic-bezier(.3,1.6,.5,1)}
.tut-card b{display:block;font-weight:400;font-size:20px;color:var(--pond-deep)}
.tut-card p{margin:4px 0 6px;font-family:var(--body);font-size:14px;line-height:1.5;color:var(--ink-soft)}
.tut-step{display:inline-block;font-family:var(--body);font-size:11px;color:#fff;background:var(--pond-deep);border-radius:99px;padding:1px 9px;margin-bottom:4px}
#tutSkip{pointer-events:auto;border:0;background:transparent;font-family:var(--body);font-size:12px;color:var(--ink-soft);text-decoration:underline;padding:2px 8px}
#tut.nohand .tut-hand{display:none}
/* ---------- shiny ---------- */
.shinybadge{position:absolute;top:-6px;left:-4px;display:flex;align-items:center;gap:2px;background:linear-gradient(135deg,#fff3b0,#f2b705);color:#6b4a00;border-radius:9px;padding:1px 6px 1px 4px;font-size:11px;box-shadow:0 2px 0 #c9971a}
.shinybadge svg{width:11px;height:11px;fill:currentColor}
.dcard.shiny{box-shadow:0 4px 0 #e0a100,0 0 0 2px #ffd54a}
.dcard.shiny .pic,.card.shiny .pic{background:radial-gradient(circle at 50% 40%,#fffbe6,#ffe58a)}
.dcard.shiny .pic img,.card.shiny .pic img,.slot.shiny img,.nestfrog.shiny img{filter:sepia(.55) saturate(2.2) brightness(1.12) drop-shadow(0 0 6px rgba(255,210,63,.95))}
.slot.shiny{box-shadow:inset 0 3px 5px rgba(0,0,0,.35),0 0 0 2px #ffd54a,0 0 12px rgba(255,213,74,.9)}
#toast.gold{box-shadow:0 4px 0 #e0a100,0 0 0 2px #ffd54a,0 8px 18px rgba(242,183,5,.35)}
#toast.ach{box-shadow:0 4px 0 #6a4fc9,0 8px 14px rgba(0,0,0,.15)}
#toast .achic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffe08a,#f2b705);color:#6b4a00}
#toast .achic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* ---------- achievements ---------- */
.ach-head{width:100%;max-width:520px;display:flex;align-items:baseline;justify-content:space-between;margin:2px 0 10px}
.ach-head h3{margin:0;font-size:20px;font-weight:400;color:#fff;text-shadow:0 2px 0 var(--pond-deep)}
.ach-head span{font-family:var(--body);font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.ach-grid{width:100%;max-width:520px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:18px}
.ach{display:grid;grid-template-columns:40px minmax(0,1fr);gap:9px;align-items:center;background:rgba(255,255,255,.85);border-radius:16px;padding:9px 10px;box-shadow:0 3px 0 rgba(106,79,201,.15)}
.ach .ai{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:#ece5fb;color:#b3a8cf}
.ach .ai svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.ach.done .ai{background:linear-gradient(135deg,#ffe08a,#f2b705);color:#6b4a00;box-shadow:0 2px 0 #c9971a}
.ach b{display:block;font-weight:400;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ach small{display:block;font-family:var(--body);font-size:11px;line-height:1.35;color:var(--ink-soft)}
.ach .pg{height:5px;border-radius:9px;background:#ece5fb;margin-top:4px;overflow:hidden}
.ach .pg i{display:block;height:100%;background:linear-gradient(90deg,#cbb8ff,#7a5cf0);border-radius:9px}
.ach:not(.done){opacity:.8}
/* ---------- frog nest ---------- */
.nest{position:relative;width:100%;max-width:440px;border-radius:24px;padding:10px 12px 12px;background:rgba(255,255,255,.55);box-shadow:0 4px 0 rgba(106,79,201,.15)}
.nest-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.nest-head b{font-weight:400;font-size:18px;color:var(--pond-deep)}
.nest-head small{font-family:var(--body);font-size:12px;color:var(--ink-soft)}
.pondbox{position:relative;height:150px;border-radius:50%/42%;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#c9ecff,#8fcff2 70%,#6cb8e6);box-shadow:inset 0 -8px 0 rgba(106,79,201,.18),inset 0 4px 10px rgba(255,255,255,.6)}
.pondbox::before{content:"";position:absolute;left:12%;top:18%;width:22%;height:10%;border-radius:50%;background:rgba(255,255,255,.45)}
.pondbox .lily{position:absolute;width:44px;height:26px;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 30deg,#5fbf6a 30deg 360deg);opacity:.9}
.nestfrog{position:absolute;width:52px;height:56px;margin:-56px 0 0 -26px;border:0;padding:0;background:transparent;cursor:pointer;transition:left var(--mv,2s) ease-in-out,top var(--mv,2s) ease-in-out}
.nestfrog::after{content:"";position:absolute;left:18%;right:18%;bottom:-3px;height:8px;border-radius:50%;background:rgba(29,53,87,.18);z-index:-1}
.nestfrog img{width:100%;height:100%;object-fit:contain;transform-origin:50% 100%;transform:scaleX(var(--fx,1))}
.nestfrog.walk img{animation:waddle .36s ease-in-out infinite alternate}
.nestfrog.hop img{animation:nhop .45s cubic-bezier(.3,1.6,.5,1)}
.nestfrog.big{width:64px;height:68px;margin:-68px 0 0 -32px}
@keyframes waddle{from{transform:scaleX(var(--fx,1)) rotate(-5deg) translateY(0)}to{transform:scaleX(var(--fx,1)) rotate(5deg) translateY(-3px)}}
@keyframes nhop{40%{transform:scaleX(var(--fx,1)) translateY(-26px) scale(1.05,.95)}}
.nest-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding-inline:24px;font-family:var(--body);font-size:13px;color:#2c5d8a}
[hidden]{display:none!important}
.lv>span.go{position:absolute;right:12px;bottom:12px}
.lv .bt{padding-right:48px}
/* ---------- home v2 ---------- */
.lv.icy{grid-column:1/-1;min-height:110px;background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.9) 0 6%,transparent 7%),linear-gradient(150deg,#e9f8ff,#a8dcf6 60%,#7cc4ee);box-shadow:0 6px 0 #5aa7d6,0 12px 18px rgba(106,79,201,.18)}
.lv.icy h3{color:#1d5f97}.lv.icy .tg,.lv.icy .meta{color:#2f6f9e}.lv.icy .bt{color:#1d3557}
.lv.icy.locked .peek{filter:brightness(0) opacity(.3)}.lv.icy.locked .go{background:#9cc7e4;box-shadow:none;color:#fff}
.lv.icy .lvst svg{fill:rgba(255,255,255,.7)}
#home{gap:14px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 70px)}
.pchip{display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:4px 14px 4px 4px;background:rgba(255,255,255,.82);box-shadow:0 3px 0 rgba(106,79,201,.2);text-align:left;min-width:0}
.pc-ring{position:relative;width:40px;height:40px;flex:none}
.pc-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.pc-ring circle{fill:none;stroke:#ece5fb;stroke-width:3.5}
.pc-ring #pcArc{stroke:var(--sun);stroke-linecap:round;stroke-dasharray:94.2;stroke-dashoffset:94.2;transition:stroke-dashoffset .6s}
.pc-ring img{position:absolute;inset:6px;width:28px;height:28px;object-fit:contain;border-radius:50%;background:#f3eeff}
.pc-txt{min-width:0}.pc-txt b{display:block;font-weight:400;font-size:15px;line-height:1.15;color:var(--pond-deep);white-space:nowrap}
.pc-txt small{display:block;font-family:var(--body);font-size:11px;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.hero{height:min(48vw,200px)}
.speech{position:absolute;z-index:3;top:4%;left:50%;transform:translateX(8%);background:#fff;color:var(--ink);font-size:14px;padding:6px 11px;border-radius:14px;white-space:nowrap;box-shadow:0 3px 0 rgba(106,79,201,.2);animation:float 3s ease-in-out infinite alternate;pointer-events:none}
.speech::after{content:"";position:absolute;left:14px;bottom:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
.lvst{display:flex;gap:2px;margin-top:2px}
.lvst svg{width:15px;height:15px;fill:#d9e6f2}.lvst svg.on{fill:var(--sun)}
.lv.hard .lvst svg,.lv.secret .lvst svg{fill:rgba(255,255,255,.22)}.lv.hard .lvst svg.on,.lv.secret .lvst svg.on{fill:#ffd23f}
.tiles{width:100%;max-width:440px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;border-radius:20px;padding:11px 6px 9px;background:#fff;box-shadow:0 4px 0 #cfc0f2,0 8px 14px rgba(106,79,201,.12);min-width:0}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #cfc0f2}
.tile .ti{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--tc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.16)}
.tile b{font-weight:400;font-size:16px;color:var(--ink)}
.tile small{font-family:var(--body);font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.t-dex{--tc:#7a5cf0}.t-ach{--tc:#f2a900}.t-rank{--tc:#ff4f8b}
.waves{position:fixed;left:0;right:0;bottom:0;width:100%;height:70px;z-index:0;pointer-events:none}
.waves path{fill:rgba(255,255,255,.45)}.waves path+path{fill:rgba(187,167,242,.55)}
.waves path:first-child{animation:wave 7s ease-in-out infinite alternate}
@keyframes wave{to{transform:translateX(-40px)}}
/* ---------- in-game polish ---------- */
#app{gap:10px}
.hud{gap:10px;padding:7px 8px;border-radius:22px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);box-shadow:0 6px 16px rgba(106,79,201,.14)}
.hud .iconbtn{width:40px;height:40px;border-radius:14px;background:linear-gradient(#fff,#f1ebff);box-shadow:0 3px 0 #cfc0f2}
.hud-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;padding:0 6px 2px 4px}
.hud-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.lvl{font-size:18px;line-height:1;color:var(--pond-deep);white-space:nowrap}
#count{font-family:var(--body);font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.hud .bar{position:relative;height:10px;border-radius:99px;background:#ece5fb;box-shadow:inset 0 1px 2px rgba(29,53,87,.18)}
.hud .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#cbb8ff,#7a5cf0);transition:width .35s}
#progFrog{position:absolute;top:50%;left:0;width:22px;height:22px;object-fit:contain;transform:translate(-50%,-50%);transition:left .35s;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25));pointer-events:none}
.timer{display:flex;align-items:center;gap:5px;height:40px;padding:0 12px;border-radius:14px;background:var(--pond-deep);color:#fff;font-size:19px;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 #4a3398;flex:none}
.timer svg.i{width:16px;height:16px;stroke-width:2.6}
.timer.warn{background:var(--berry);box-shadow:0 3px 0 var(--berry-dark)}
#stage{border-radius:28px}
#tray{gap:5px;padding:8px 8px 10px;border-radius:22px;background:linear-gradient(180deg,#dba46c 0%,#bb7d42 55%,#9a5f2c 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.15),0 5px 0 #6b3f1a,0 12px 18px rgba(106,79,201,.2)}
#tray.danger{box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 5px 0 #6b3f1a,0 0 0 3px var(--berry),0 0 18px rgba(239,90,122,.55)}
.slot{border-radius:13px;background:linear-gradient(180deg,rgba(60,30,8,.4),rgba(60,30,8,.22));box-shadow:inset 0 3px 5px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.25);transition:box-shadow .2s}
.slot.held{transform:scale(1.08);box-shadow:inset 0 3px 5px rgba(0,0,0,.35),0 0 0 2px #fff1a6,0 0 14px rgba(255,241,166,.95)}
.slot.pair{box-shadow:inset 0 3px 5px rgba(0,0,0,.35),0 0 0 2px #ffe08a,0 0 10px rgba(255,224,138,.85)}
.tools{gap:10px}
.tool{gap:4px;padding:8px 4px 7px;border-radius:18px;background:#fff;color:var(--ink);font-size:14px;box-shadow:0 4px 0 #cfc0f2,0 8px 14px rgba(106,79,201,.12)}
.tool .ic{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--tc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.tool .ic svg.i{width:19px;height:19px}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 #cfc0f2}
.tool:disabled{opacity:.62;filter:grayscale(.5);transform:none}
.tool b{top:-5px;right:-3px;background:var(--tc);box-shadow:0 0 0 2px #fff}
.tool.pulse .ic{animation:pulse .5s}
@keyframes pulse{30%{transform:scale(1.25) rotate(-12deg)}60%{transform:scale(.95) rotate(8deg)}}
.t-out{--tc:#2f80ed}.t-fill{--tc:#ff4f8b}.t-mix{--tc:#9b51e0}.t-shake{--tc:#27ae60}
body.space .hud{background:rgba(32,24,86,.6);border-color:rgba(255,255,255,.14);box-shadow:0 6px 16px rgba(0,0,0,.3)}
body.space .lvl{color:#fff}body.space #count{color:#cdbcff}
body.space .hud .bar{background:rgba(255,255,255,.14)}
body.space .hud .bar i{background:linear-gradient(90deg,#b388ff,#ffe08a)}
body.space .timer{background:#5b3fc4;box-shadow:0 3px 0 #2e1d7a}
body.space .tool{background:rgba(255,255,255,.1);color:#fff;box-shadow:0 4px 0 #0b0720}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  setLoad(92,'捏奶蛙');makeThumbs();fitCamera();$('loading').hidden=true;startDemo();requestAnimationFrame(loop);setLoad(100,'准备好了');
  $('lv1').disabled=false;$('lv2').disabled=false;$('lv3').disabled=false;$('lv4').disabled=false;renderHome();
  $('lv4').onclick=()=>{if(!unlockedL3){const b=$('lv4');b.classList.remove('nudge');void b.offsetWidth;b.classList.add('nudge');SFX.tick();return}SFX.click();go('game');startLevel(3)};
  $('lv3').onclick=()=>{SFX.click();go('game');startLevel(2)};
  $('lv1').onclick=()=>{SFX.click();go('game');startLevel(0)};
  $('lv2').onclick=()=>{if(!unlocked2){const b=$('lv2');b.classList.remove('nudge');void b.offsetWidth;b.classList.add('nudge');SFX.tick();return}SFX.click();go('game');startLevel(1)};
  if(screen==='dex')renderDex();
});
}
